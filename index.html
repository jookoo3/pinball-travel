<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="한반도 핀볼 여행 — 핀볼을 튕겨 다음 여행지를 정하세요" />
    <title>Pinball Travel · 한반도 핀볼 여행</title>
    <!-- style.css를 <link>로 직접 로드해 렌더링을 막아야(render-blocking) 새로고침 시
         스타일 없는 화면이나 카드 placeholder가 잠깐 노출되는 FOUC를 막을 수 있다 -->
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* 위 스타일시트가 아주 잠깐이라도 늦게 적용될 경우를 대비한 최소 안전장치 */
      html, body { background: #070b1e; }
      .overlay { opacity: 0; pointer-events: none; }
    </style>
    <!-- ══ 링크 공유 시 미리보기 카드(Open Graph / Twitter Card) ══ -->
    <!-- TODO: 실제 배포 도메인이 정해지면 아래 og:url / og:image의 https://pinballtravel.app 을 교체하세요 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pinball Travel" />
    <meta property="og:title" content="Pinball Travel · 한반도 핀볼 여행" />
    <meta property="og:description" content="핀볼을 튕겨서 정하는 대한민국 여행지! 너도 한 번 굴려봐 🎱" />
    <meta property="og:image" content="https://pinballtravel.app/og-image.svg" />
    <meta property="og:url" content="https://pinballtravel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinball Travel · 한반도 핀볼 여행" />
    <meta name="twitter:description" content="핀볼을 튕겨서 정하는 대한민국 여행지! 너도 한 번 굴려봐 🎱" />
    <meta name="twitter:image" content="https://pinballtravel.app/og-image.svg" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5199678305878215"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app">
      <!-- ═══════════ HOME ═══════════ -->
      <section id="screen-home" class="screen active">
        <div class="stars"></div>
        <div class="home-inner">
          <div class="logo-wrap">
            <div class="logo-ball"></div>
            <h1 class="logo">PINBALL<span>TRAVEL</span></h1>
            <p class="tagline">핀볼을 튕겨서 정하는 대한민국 여행지 🇰🇷</p>
          </div>

          <div class="mode-cards">
            <button class="mode-card" data-mode="province">
              <div class="mode-emoji">🗺️</div>
              <div class="mode-name">간략한 지도</div>
              <div class="mode-desc">8도 지도에서 핀볼 굴리기<br/>당첨된 도시에서 더 자세히 파고들 수 있어요</div>
            </button>
            <button class="mode-card" data-mode="city">
              <div class="mode-emoji">📍</div>
              <div class="mode-name">자세한 지도</div>
              <div class="mode-desc">전국을 시·군 단위로 쪼갠 정밀 지도에서<br/>한 번에 세부 여행지 결정</div>
            </button>
            <button class="mode-card locked" data-mode="secret">
              <div class="mode-emoji">🔒</div>
              <div class="mode-name">세계 지도</div>
              <div class="mode-desc">Coming Soon</div>
            </button>
          </div>

        </div>
        <footer class="site-footer">
          <a href="/about.html">게임 소개</a>
          <a href="/privacy.html">개인정보처리방침</a>
          <a href="/terms.html">이용약관</a>
        </footer>
      </section>

      <!-- ═══════════ GAME ═══════════ -->
      <section id="screen-game" class="screen">
        <div class="game-topbar">
          <button id="btn-back" class="ghost-btn">← 나가기</button>
          <div class="game-title" id="game-title">팔도 유람</div>
          <div class="timer-wrap">
            <div class="timer-num" id="timer-num">--</div>
            <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
          </div>
          <button id="btn-mute" class="icon-btn" aria-label="소리 끄기" aria-pressed="false" title="소리 끄기">🔊</button>
        </div>
        <div class="game-controls">
          <div class="time-select" id="time-select">
            <span class="ctl-label">⏱ <span class="txt">시간</span></span>
            <div class="seg">
              <button class="time-btn" data-time="10">10초</button>
              <button class="time-btn active" data-time="20">20초</button>
              <button class="time-btn" data-time="30">30초</button>
              <button class="time-btn" data-time="custom">✏️ 직접입력</button>
              <button class="time-btn" data-time="random">🎲 랜덤</button>
            </div>
            <div id="custom-time-wrap" class="custom-time hidden">
              <input id="custom-time" type="number" min="1" max="120" value="15" inputmode="numeric" />
              <span>초</span>
            </div>
            <div id="random-time-hint" class="random-hint hidden">발사 시 1~60초 무작위!</div>
          </div>
          <div class="start-select" id="start-select">
            <span class="ctl-label">📍 <span class="txt">착지</span></span>
            <div class="seg">
              <button class="start-btn active" data-start="random">🎲 랜덤</button>
              <button class="start-btn" data-start="pick">👆 직접 선택</button>
            </div>
            <button id="btn-reroll" class="mini-btn" title="착지 지점 다시 뽑기">🔀 다시 뽑기</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="game-canvas"></canvas>
          <div id="hint" class="hint">🎯 플런저를 <b>아래로 당겼다 놓아</b> 발사하세요</div>
        </div>
      </section>

      <!-- ═══════════ RESULT CARD ═══════════ -->
      <div id="result-overlay" class="overlay">
        <div class="result-card" id="result-card">
          <div class="card-stamp">TRAVEL PICK</div>
          <div class="card-emoji" id="card-emoji">🏝️</div>
          <div class="card-region" id="card-region">제주도</div>
          <div class="card-sub" id="card-sub"></div>
          <div class="card-desc" id="card-desc"></div>
          <div class="card-actions">
            <button id="btn-detail" class="cta primary">🔎 더 자세히 정하기</button>
            <button id="btn-share" class="cta share">📤 결과 공유하기</button>
            <button id="btn-retry" class="cta">🔄 다시 하기</button>
            <button id="btn-home" class="cta ghost">🏠 처음으로</button>
          </div>
        </div>
      </div>

      <div id="loading" class="loading hidden"><div class="spinner"></div><p>한반도 해안선 그리는 중…</p></div>
      <div id="toast" class="toast"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
